name: API Probe

# Read-only diagnosis of the live API + push pipeline state.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Probe live API
        run: |
          mkdir -p bench-results
          {
            echo "== /api/search (API alive?) =="
            curl -sS -m 15 -o /dev/null -w "HTTP %{http_code}, %{time_total}s\n" "https://supermarket-compare-production.up.railway.app/api/search?q=%D7%97%D7%9C%D7%91&limit=1"
            echo "== /api/push/vapid-key (VAPID configured?) =="
            curl -sS -m 15 "https://supermarket-compare-production.up.railway.app/api/push/vapid-key" | head -c 200; echo
            echo "== /api/push/send-test unauthenticated (401 = new code deployed) =="
            curl -sS -m 15 -o /dev/null -w "HTTP %{http_code}\n" -X POST -H "Content-Type: application/json" -H "x-admin-key: wrong-key-probe" -d '{}' "https://supermarket-compare-production.up.railway.app/api/push/send-test"
            echo "== produce stamping check: do the user's list items carry our image? =="
            for q in "סלק" "שמיר" "לימון בלאדי" "מלפפון בייבי"; do
              echo "-- $q:"
              curl -sS -m 15 "https://supermarket-compare-production.up.railway.app/api/search?q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")&limit=4" \
                | python3 -c "import json,sys;[print('  ',r['id'],r['name'],'| cat:',r.get('category'),'| img:',(r.get('imageUrl') or 'NULL')[:60]) for r in json.load(sys.stdin).get('results',[])]"
            done
            echo "== blog widget v2: shake ingredients (watch for flavored-dessert mismatches) =="
            curl -sS -m 25 "https://www.savy.co.il/embed/recipe?n=%D7%A9%D7%99%D7%99%D7%A7%20%D7%91%D7%A0%D7%A0%D7%94&ing=%D7%91%D7%A0%D7%A0%D7%94%3A2%2C%D7%97%D7%9C%D7%91%20%D7%A9%D7%A7%D7%93%D7%99%D7%9D%3A%D7%9B%D7%95%D7%A1%2C%D7%A9%D7%99%D7%91%D7%95%D7%9C%D7%AA%20%D7%A9%D7%95%D7%A2%D7%9C%3A3%20%D7%9B%D7%A4%D7%95%D7%AA%2C%D7%A1%D7%99%D7%A8%D7%95%D7%A4%20%D7%90%D7%92%D7%91%D7%94%3A%D7%9B%D7%A3%2C%D7%AA%D7%9E%D7%A6%D7%99%D7%AA%20%D7%95%D7%A0%D7%99%D7%9C%3A%D7%9B%D7%A4%D7%99%D7%AA%2C%D7%AA%D7%95%D7%AA%D7%99%D7%9D%20%D7%A7%D7%A4%D7%95%D7%90%D7%99%D7%9D%3A%D7%9B%D7%95%D7%A1" \
              | tr -d '\n' | grep -oE 'class="chip"[^<]*<' | head -10
          } | tee bench-results/api-probe.txt
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: DB state
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip -q install psycopg2-binary
          python - <<'EOF' | tee -a bench-results/api-probe.txt
          import os, psycopg2
          conn = psycopg2.connect(os.environ['DATABASE_URL']); cur = conn.cursor()
          cur.execute("SELECT COUNT(*) FROM push_subscription")
          print(f"push subscribers: {cur.fetchone()[0]}")
          cur.execute("SELECT week, slug, status, created_at, sent_at, sent_count, fail_count FROM push_campaign ORDER BY id DESC LIMIT 5")
          for r in cur.fetchall(): print("campaign:", r)
          EOF
      - name: Commit results
        run: |
          git config user.name "savy-bench"
          git config user.email "bench@savy.co.il"
          git checkout -B bench-data
          git add bench-results/api-probe.txt
          git commit -m "chore(bench): api probe [skip ci]" || echo "no changes"
          git push -f origin bench-data
