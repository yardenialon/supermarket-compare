name: DB Diagnose

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install psycopg2
        run: pip install psycopg2-binary
      - name: Image coverage report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          mkdir -p bench-results
          python3 - <<'EOF' 2>&1 | tee bench-results/diagnose.txt
          import os, psycopg2
          cur = psycopg2.connect(os.environ['DATABASE_URL']).cursor()
          cur.execute("""
            SELECT
              CASE WHEN COALESCE(store_count,0) >= 500 THEN 'a: 500+ stores'
                   WHEN COALESCE(store_count,0) >= 100 THEN 'b: 100-499'
                   WHEN COALESCE(store_count,0) >= 10  THEN 'c: 10-99'
                   WHEN COALESCE(store_count,0) >= 3   THEN 'd: 3-9'
                   ELSE 'e: under 3' END AS tier,
              COUNT(*) AS products,
              COUNT(*) FILTER (WHERE image_url IS NOT NULL AND image_url != '') AS with_img
            FROM product GROUP BY 1 ORDER BY 1""")
          print(f"{'tier':<16}{'products':>10}{'with img':>10}{'missing':>10}{'coverage':>10}")
          tm = 0
          for tier, n, w in cur.fetchall():
              print(f"{tier:<16}{n:>10}{w:>10}{n-w:>10}{100*w//n:>9}%")
              if tier != 'e: under 3': tm += n - w
          print(f"\nmissing in tiers a-d (what shoppers actually see): {tm}")
          cur.execute("""SELECT COUNT(*) FROM product
                         WHERE (image_url IS NULL OR image_url='')
                           AND image_checked_at IS NOT NULL""")
          print(f"already attempted but nothing found (image_checked_at set, still empty): {cur.fetchone()[0]}")
          EOF
      - name: Commit results
        if: always()
        run: |
          git config user.name "savy-bench"
          git config user.email "bench@savy.co.il"
          git checkout -B bench-data
          git add bench-results/diagnose.txt
          git commit -m "chore(bench): image coverage [skip ci]" || echo "no changes"
          git push -f origin bench-data
