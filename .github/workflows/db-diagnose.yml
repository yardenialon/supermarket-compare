name: DB Diagnose

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install psycopg2
        run: pip install psycopg2-binary
      - name: Audit produce stamps
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p bench-results
          python - <<'EOF' | tee bench-results/diagnose.txt
          import os, psycopg2
          conn = psycopg2.connect(os.environ['DATABASE_URL']); cur = conn.cursor()
          STAMP = "image_url ILIKE '%/produce-img/%'"

          cur.execute(f"SELECT COUNT(*) FROM product WHERE {STAMP}")
          print(f"total stamped: {cur.fetchone()[0]}")

          # national branded products = high store_count; weighed produce is lower.
          # the wrongly stamped processed items should dominate the top of this list
          print("\n== top 220 stamped by store_count ==")
          cur.execute(f"""SELECT store_count, COALESCE(brand,''), COALESCE(subcategory,''), name
                          FROM product WHERE {STAMP}
                          ORDER BY store_count DESC NULLS LAST LIMIT 220""")
          for sc, brand, sub, name in cur.fetchall():
              print(f"{sc}\t[{brand}]\t({sub})\t{name}")

          print("\n== stamped brand frequency (store_count>600) ==")
          cur.execute(f"""SELECT COALESCE(brand,'(none)'), COUNT(*) FROM product
                          WHERE {STAMP} AND COALESCE(store_count,0) > 600
                          GROUP BY 1 ORDER BY 2 DESC LIMIT 40""")
          for b, n in cur.fetchall(): print(f"{n}\t{b}")

          print("\n== stamped names containing latin letters ==")
          cur.execute(f"""SELECT store_count, name FROM product
                          WHERE {STAMP} AND name ~ '[A-Za-z]'
                          ORDER BY store_count DESC NULLS LAST LIMIT 60""")
          for sc, name in cur.fetchall(): print(f"{sc}\t{name}")

          print("\n== stamped names with liquid volume ==")
          cur.execute(f"""SELECT store_count, name FROM product
                          WHERE {STAMP} AND name ~ '[0-9](\\.[0-9])?\\s*(ליטר|ל''|מ"ל|מל\\M)'
                          ORDER BY store_count DESC NULLS LAST LIMIT 60""")
          for sc, name in cur.fetchall(): print(f"{sc}\t{name}")

          print("\n== subcategory distribution of stamped ==")
          cur.execute(f"""SELECT COALESCE(subcategory,'(none)'), COUNT(*) FROM product
                          WHERE {STAMP} GROUP BY 1 ORDER BY 2 DESC LIMIT 30""")
          for s, n in cur.fetchall(): print(f"{n}\t{s}")
          EOF
      - name: Commit results
        run: |
          git config user.name "savy-bench"
          git config user.email "bench@savy.co.il"
          git checkout -B bench-data
          git add bench-results/diagnose.txt
          git commit -m "chore(bench): produce stamp audit [skip ci]" || echo "no changes"
          git push -f origin bench-data
