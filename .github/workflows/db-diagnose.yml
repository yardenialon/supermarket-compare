name: DB Diagnose

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install psycopg2
        run: pip install psycopg2-binary
      - name: Online stores audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          mkdir -p bench-results
          python3 - <<'EOF' 2>&1 | tee bench-results/diagnose.txt
          import os, psycopg2
          cur = psycopg2.connect(os.environ['DATABASE_URL']).cursor()
          print("== is_online stores per chain ==")
          cur.execute("""SELECT rc.name, COUNT(*),
                                MIN(s.name), MAX(s.name)
                         FROM store s JOIN retailer_chain rc ON rc.id=s.chain_id
                         WHERE s.is_online GROUP BY rc.name ORDER BY 2 DESC""")
          for r in cur.fetchall(): print(r)
          print("\n== all online stores of the biggest offender ==")
          cur.execute("""SELECT s.id, s.name, s.city,
                                (SELECT COUNT(*) FROM store_price sp WHERE sp.store_id=s.id) prices
                         FROM store s JOIN retailer_chain rc ON rc.id=s.chain_id
                         WHERE s.is_online AND rc.name = (
                           SELECT rc2.name FROM store s2 JOIN retailer_chain rc2 ON rc2.id=s2.chain_id
                           WHERE s2.is_online GROUP BY rc2.name ORDER BY COUNT(*) DESC LIMIT 1)
                         ORDER BY prices DESC LIMIT 40""")
          for r in cur.fetchall(): print(r)
          EOF
      - name: Commit results
        if: always()
        run: |
          git config user.name "savy-bench"
          git config user.email "bench@savy.co.il"
          git checkout -B bench-data
          git add bench-results/diagnose.txt
          git commit -m "chore(bench): online stores audit [skip ci]" || echo "no changes"
          git push -f origin bench-data
