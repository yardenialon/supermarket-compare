name: DB Diagnose

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install psycopg2
        run: pip install psycopg2-binary
      - name: Trace barcode 7290018710982
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          mkdir -p bench-results
          python3 - <<'EOF' 2>&1 | tee bench-results/diagnose.txt
          import os, datetime, urllib.request, psycopg2
          BC = "7290018710982"
          UA = {'User-Agent': 'SavyBot/1.0 (+https://savy.co.il)'}
          data = None
          for d in range(0, 8):
              day = (datetime.date.today() - datetime.timedelta(days=d)).strftime("%Y%m%d")
              try:
                  req = urllib.request.Request(f"https://hahishook.com/wp-content/uploads/chp/{day}.tsv", headers=UA)
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data = r.read().decode('utf-8', 'ignore'); print("file:", day); break
              except Exception: pass
          print(f"== lines containing {BC} ==")
          found = False
          for line in data.split('\n'):
              if BC in line:
                  found = True
                  c = line.rstrip('\r').split('\t')
                  print({'itemcode': c[0], 'price': c[1], 'capacity': c[3], 'units': c[6],
                         'name': c[5], 'leading': c[9], 'similar': c[10]})
          if not found: print("NOT in daily file at all")

          cur = psycopg2.connect(os.environ['DATABASE_URL']).cursor()
          print(f"\n== our product for barcode {BC} ==")
          cur.execute("""SELECT id, name, unit_qty, unit_measure, min_price, store_count
                         FROM product WHERE barcode=%s""", (BC,))
          rows = cur.fetchall()
          for r in rows: print(r)
          if rows:
              pid = rows[0][0]
              cur.execute("""SELECT price, deeplink IS NOT NULL FROM store_price
                             WHERE store_id=2426945 AND product_id=%s""", (pid,))
              print("hishook price row:", cur.fetchall())
          EOF
      - name: Commit results
        if: always()
        run: |
          git config user.name "savy-bench"
          git config user.email "bench@savy.co.il"
          git checkout -B bench-data
          git add bench-results/diagnose.txt
          git commit -m "chore(bench): barcode trace [skip ci]" || echo "no changes"
          git push -f origin bench-data
