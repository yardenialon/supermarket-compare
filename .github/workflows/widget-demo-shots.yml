name: Widget Demo Shots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Shoot blogger pages with the live widget injected
        run: |
          mkdir -p bench-results/widget-shots
          cat > ./shots.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 700, height: 760 }, deviceScaleFactor: 2 });
            const ing = encodeURIComponent([
              'עגבניות בשלות:6','פלפל אדום:1','בצל:1','שום:3','רסק עגבניות',
              'ביצים:6','גבינה בולגרית','שמן זית:3','פפריקה מתוקה','לחם טרי:1',
            ].join(','));
            const url = 'https://savy.co.il/embed/recipe?n=' + encodeURIComponent('שקשוקה ביתית קלאסית') + '&ing=' + ing + '&src=demo';
            await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(7000);
            await page.screenshot({ path: 'bench-results/widget-shots/embed-demo.png', fullPage: true });
            console.log('EMBED SHOT OK');
            await browser.close();
          })();
          EOF
          node ./shots.js 2>&1 | tee bench-results/widget-shots/log.txt
      - name: Commit results
        if: always()
        run: |
          git config user.name "savy-bench"
          git config user.email "bench@savy.co.il"
          git checkout -B bench-data
          git add bench-results/widget-shots
          git commit -m "chore(bench): widget demo screenshots [skip ci]" || echo "no changes"
          git push -f origin bench-data
