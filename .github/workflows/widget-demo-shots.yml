name: Widget Demo Shots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Shoot blogger pages with the live widget injected
        run: |
          mkdir -p bench-results/widget-shots
          cat > ./shots.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const BLOGS = [
            { name: 'plplt',       home: 'https://plplt.co.il/', skipFirst: 1 },
            { name: 'bishulbezol', home: 'http://bishulbezol.blogspot.com/' },
            { name: 'matanot',     home: 'https://matanot-ktanot.co.il/' },
          ];
          const log = (...a) => console.log(...a);

          (async () => {
            const browser = await chromium.launch();
            for (const blog of BLOGS) {
              try {
                const page = await browser.newPage({ viewport: { width: 1280, height: 1000 }, deviceScaleFactor: 2 });
                // post URLs from the site feed (reliable), homepage as fallback
                let links = [];
                const feeds = blog.home.includes('blogspot')
                  ? [blog.home.replace(/\/$/, '') + '/feeds/posts/default?alt=rss&max-results=15']
                  : [blog.home.replace(/\/$/, '') + '/feed/'];
                for (const feedUrl of feeds) {
                  try {
                    const resp = await page.request.get(feedUrl, { timeout: 30000 });
                    const xml = await resp.text();
                    links.push(...[...xml.matchAll(/<link>([^<]+)<\/link>/g)].map(m => m[1])
                      .concat([...xml.matchAll(/<link[^>]*href="([^"]+)"[^>]*\/>/g)].map(m => m[1])));
                  } catch (e) { log(blog.name, 'feed failed:', e.message.slice(0, 60)); }
                }
                const host = new URL(blog.home).host;
                links = [...new Set(links)]
                  .filter(h => { try { return new URL(h).host.replace('www.','') === host.replace('www.',''); } catch { return false; } })
                  .filter(h => h.replace(/https?:\/\/[^/]+\/?/, '').length > 8)
                  // blogspot: static pages (/p/...) are indexes, posts live under /YYYY/
                  .filter(h => !blog.home.includes('blogspot') || /\/20\d{2}\//.test(h));
                if (!links.length) {
                  await page.goto(blog.home, { waitUntil: 'domcontentloaded', timeout: 45000 });
                  links = [...new Set(await page.$$eval('a[href]', as => as.map(a => a.href)))]
                    .filter(h => { try { return new URL(h).host === host; } catch { return false; } })
                    .filter(h => !/categor|tag|about|contact|אודות|קשר|#/i.test(h));
                }
                log(blog.name, 'candidates:', links.length);
                let found = null;
                let matches = 0;
                for (const link of links.slice(0, 14)) {
                  try {
                    await page.goto(link, { waitUntil: 'domcontentloaded', timeout: 30000 });
                    const text = await page.evaluate(() => document.body.innerText);
                    const hits = (text.match(/כוס |כפית|כף |גרם|ביצים|קמח|סוכר|בצל|שמן זית|מלח/g) || []).length;
                    if (hits >= 4) { matches++; if (matches > (blog.skipFirst || 0)) { found = link; break; } }
                  } catch (e) { log('  skip', link, e.message.slice(0, 60)); }
                }
                if (!found) { log(blog.name, 'NO RECIPE PAGE FOUND'); await page.close(); continue; }
                log(blog.name, 'recipe:', found);
                // inject the real widget exactly as an installed blog would
                await page.addScriptTag({ url: 'https://savy.co.il/widget.js' });
                let frame = null;
                try {
                  frame = await page.waitForSelector('iframe[src*="savy.co.il/embed/recipe"]', { timeout: 25000 });
                } catch {}
                if (!frame) {
                  log(blog.name, 'widget did not auto-attach — building manual embed');
                  // crude fallback: take the first ul near an ingredients heading
                  const ings = await page.evaluate(() => {
                    const MEAS = /כוס|כפית|כף|גרם|ק"ג|מ"ל|ביצ|קמח|סוכר|שמן|בצל|שום|מלח|חבילת|קופסת/;
                    let best = null, bestScore = 0;
                    for (const ul of document.querySelectorAll('ul, ol')) {
                      const items = [...ul.querySelectorAll('li')].map(li => li.innerText.trim()).filter(t => t && t.length < 90);
                      const score = items.filter(t => MEAS.test(t)).length;
                      if (score > bestScore) { bestScore = score; best = items; }
                    }
                    if (bestScore >= 3) return best.slice(0, 15);
                    // blogspot-style: <br>-separated lines in the post body
                    const lines = document.body.innerText.split('\n').map(t => t.trim());
                    let run = [], bestRun = [];
                    for (const t of lines) {
                      if (t && t.length < 90 && MEAS.test(t)) { run.push(t); if (run.length > bestRun.length) bestRun = [...run]; }
                      else if (t === '' || t.length >= 90) run = [];
                    }
                    return bestRun.length >= 3 ? bestRun.slice(0, 15) : null;
                  });
                  if (!ings) { log(blog.name, 'no ingredient list parsed'); await page.close(); continue; }
                  const url = 'https://savy.co.il/embed/recipe?t=' + encodeURIComponent(document_title_safe(await page.title())) + '&ing=' + encodeURIComponent(ings.join('\n')) + '&utm_source=demo';
                  frame = await page.evaluate((src) => {
                    const uls = [...document.querySelectorAll('ul, ol')];
                    const target = uls[0];
                    const f = document.createElement('iframe');
                    f.src = src; f.style.cssText = 'width:100%;max-width:680px;height:380px;border:0;margin:16px 0;';
                    target.parentNode.insertBefore(f, target.nextSibling);
                    return true;
                  }, url).then(() => page.waitForSelector('iframe[src*="savy.co.il/embed/recipe"]', { timeout: 15000 }));
                }
                await frame.scrollIntoViewIfNeeded();
                await page.waitForTimeout(6000); // let prices load
                const box = await frame.boundingBox();
                const clip = {
                  x: Math.max(0, box.x - 40),
                  y: Math.max(0, box.y - 420),
                  width: Math.min(1280, box.width + 80),
                  height: box.height + 460,
                };
                await page.screenshot({ path: `bench-results/widget-shots/${blog.name}.png`, clip });
                log(blog.name, 'SHOT OK');
                await page.close();
              } catch (e) { log(blog.name, 'FAILED:', e.message.slice(0, 200)); }
            }
            await browser.close();
            function document_title_safe(t) { return (t || 'מתכון').slice(0, 60); }
          })();
          EOF
          node ./shots.js 2>&1 | tee bench-results/widget-shots/log.txt
      - name: Commit results
        if: always()
        run: |
          git config user.name "savy-bench"
          git config user.email "bench@savy.co.il"
          git checkout -B bench-data
          git add bench-results/widget-shots
          git commit -m "chore(bench): widget demo screenshots [skip ci]" || echo "no changes"
          git push -f origin bench-data
