name: Fetch Recipe Images

# One-shot: downloads the AI-generated recipe photos from the generation CDN
# (unreachable from the dev sandbox), compresses them, and commits them to main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install pillow
      - name: Download and compress
        run: |
          mkdir -p apps/web/public/recipes-img
          python - <<'EOF'
          import urllib.request, io
          from PIL import Image
          IMAGES = {
            "pizza-beitit": "https://d8j0ntlcm91z4.cloudfront.net/user_346B4hPO8Cc9EBBTKCY2nMoMMdB/hf_20261105_005425_5337c4b8-73f7-400c-9fc8-f4cb76bb4d89.png",
            "pasta-shamenet-pitriyot": "https://d8j0ntlcm91z4.cloudfront.net/user_346B4hPO8Cc9EBBTKCY2nMoMMdB/hf_20261105_005427_cbe3701f-41ce-405f-8111-599468129a4c.png",
            "ktzitzot-berotev-ptitim": "https://d8j0ntlcm91z4.cloudfront.net/user_346B4hPO8Cc9EBBTKCY2nMoMMdB/hf_20261105_005428_38cedbfa-1bd1-4499-ad2a-183bdc9247e7.png",
            "marak-katom": "https://d8j0ntlcm91z4.cloudfront.net/user_346B4hPO8Cc9EBBTKCY2nMoMMdB/hf_20261105_005425_0ce73dc6-3dff-4a67-b2be-fc78a15d3d47.png",
            "salat-pasta-tuna": "https://d8j0ntlcm91z4.cloudfront.net/user_346B4hPO8Cc9EBBTKCY2nMoMMdB/hf_20261105_005427_4c92e85a-f8a6-4e4b-a1b0-30920a527735.png",
            "of-bedvash": "https://d8j0ntlcm91z4.cloudfront.net/user_346B4hPO8Cc9EBBTKCY2nMoMMdB/hf_20261105_005427_44955b9d-38a1-4e4a-b39c-6fee0566f693.png",
            "orez-mukpatz": "https://d8j0ntlcm91z4.cloudfront.net/user_346B4hPO8Cc9EBBTKCY2nMoMMdB/hf_20261105_005426_661b8c08-3e17-4484-8531-d7061516a213.png",
            "ugiyot-shokolad-chips": "https://d8j0ntlcm91z4.cloudfront.net/user_346B4hPO8Cc9EBBTKCY2nMoMMdB/hf_20261105_005426_6b16fd40-f255-473d-804e-98d6cc382008.png",
            "kuskus-im-yerakot": "https://d8j0ntlcm91z4.cloudfront.net/user_346B4hPO8Cc9EBBTKCY2nMoMMdB/hf_20261105_005427_550927d5-9b8f-491c-be9f-7769d25c9ba2.png",
            "sabich-beiti": "https://d8j0ntlcm91z4.cloudfront.net/user_346B4hPO8Cc9EBBTKCY2nMoMMdB/hf_20261105_005426_0c20d84b-d9bf-4b15-94f2-78733b2b8ede.png",
          }
          for slug, url in IMAGES.items():
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              data = urllib.request.urlopen(req, timeout=60).read()
              img = Image.open(io.BytesIO(data)).convert("RGB")
              img.thumbnail((800, 800), Image.LANCZOS)
              out = f"apps/web/public/recipes-img/{slug}.jpg"
              img.save(out, "JPEG", quality=82, optimize=True, progressive=True)
              print(f"{slug}: {len(data)//1024}KB -> saved {out}")
          EOF
          ls -la apps/web/public/recipes-img/
      - name: Commit to main
        run: |
          git config user.name "savy-bench"
          git config user.email "bench@savy.co.il"
          git add apps/web/public/recipes-img
          git commit -m "feat(recipes): AI-generated recipe photos (Higgsfield, compressed)"
          git pull --rebase origin main
          git push origin main
