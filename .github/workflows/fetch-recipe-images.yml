name: Fetch Recipe Images

# One-shot: downloads the AI-generated recipe photos from the generation CDN
# (unreachable from the dev sandbox), compresses them, and commits them to main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install pillow
      - name: Download and compress
        run: |
          mkdir -p apps/web/public/recipes-img
          python - <<'EOF'
          import urllib.request, io
          from PIL import Image
          IMAGES = {
            "shakshuka": "https://d8j0ntlcm91z4.cloudfront.net/user_346B4hPO8Cc9EBBTKCY2nMoMMdB/hf_20261105_002951_69bd3317-00b7-4460-aba7-a8952fd37069.png",
            "schnitzel-u-pure": "https://d8j0ntlcm91z4.cloudfront.net/user_346B4hPO8Cc9EBBTKCY2nMoMMdB/hf_20261105_002949_d520cd03-9aad-4ac5-a5a8-34a3b87741c0.png",
            "pasta-rotev-agvaniyot": "https://d8j0ntlcm91z4.cloudfront.net/user_346B4hPO8Cc9EBBTKCY2nMoMMdB/hf_20261105_002952_8d3ceb67-792d-4af4-9db9-a26f175e42ff.png",
            "ugat-gvina-afuya": "https://d8j0ntlcm91z4.cloudfront.net/user_346B4hPO8Cc9EBBTKCY2nMoMMdB/hf_20261105_002949_68ce2e6d-5124-43fa-8c02-1141ffdec4ac.png",
            "pancakes-shel-shabat": "https://d8j0ntlcm91z4.cloudfront.net/user_346B4hPO8Cc9EBBTKCY2nMoMMdB/hf_20261105_002949_3504388c-496a-4287-bbce-0d181ad2c23d.png",
            "majadra": "https://d8j0ntlcm91z4.cloudfront.net/user_346B4hPO8Cc9EBBTKCY2nMoMMdB/hf_20261105_002952_04adc0b5-37bc-4bed-b3f0-f5c8de09685a.png",
            "marak-adashim": "https://d8j0ntlcm91z4.cloudfront.net/user_346B4hPO8Cc9EBBTKCY2nMoMMdB/hf_20261105_002949_07a62d1e-2842-42a5-a9c7-856f5db1ed90.png",
            "aruhat-erev-israelit": "https://d8j0ntlcm91z4.cloudfront.net/user_346B4hPO8Cc9EBBTKCY2nMoMMdB/hf_20261105_002950_45cfa739-d644-45e8-9fde-5235b24b8666.png",
            "levivot": "https://d8j0ntlcm91z4.cloudfront.net/user_346B4hPO8Cc9EBBTKCY2nMoMMdB/hf_20261105_002950_3b912337-799f-4ff3-81a9-8dd7185c791b.png",
            "sufganiyot-beitiyot": "https://d8j0ntlcm91z4.cloudfront.net/user_346B4hPO8Cc9EBBTKCY2nMoMMdB/hf_20261105_002950_ce7689a1-75c8-415e-b49e-29bc3f4426d7.png",
            "kadurei-shokolad": "https://d8j0ntlcm91z4.cloudfront.net/user_346B4hPO8Cc9EBBTKCY2nMoMMdB/hf_20261105_002950_eb987c72-bc02-4486-8bce-d973a854a8c5.png",
          }
          for slug, url in IMAGES.items():
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              data = urllib.request.urlopen(req, timeout=60).read()
              img = Image.open(io.BytesIO(data)).convert("RGB")
              img.thumbnail((800, 800), Image.LANCZOS)
              out = f"apps/web/public/recipes-img/{slug}.jpg"
              img.save(out, "JPEG", quality=82, optimize=True, progressive=True)
              print(f"{slug}: {len(data)//1024}KB -> saved {out}")
          EOF
          ls -la apps/web/public/recipes-img/
      - name: Commit to main
        run: |
          git config user.name "savy-bench"
          git config user.email "bench@savy.co.il"
          git add apps/web/public/recipes-img
          git commit -m "feat(recipes): AI-generated recipe photos (Higgsfield, compressed)"
          git pull --rebase origin main
          git push origin main
