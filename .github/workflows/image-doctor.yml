name: Image Doctor

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      verify_batch:
        description: 'How many images to vision-verify this run'
        default: '2000'
        required: false

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install psycopg2-binary

      - name: Fill missing images (chain CDNs / Open Food Facts / SerpAPI)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          IMAGE_BATCH_SIZE: '500'
        run: python scripts/update_images.py

      - name: Vision-verify images with Claude
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERIFY_BATCH: ${{ github.event.inputs.verify_batch || '2000' }}
        run: python scripts/verify_images.py
