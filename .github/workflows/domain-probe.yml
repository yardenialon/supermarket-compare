name: Domain Probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Check host behavior and product-page health
        run: |
          mkdir -p bench-results
          {
            echo "== SSR product pages (status + time), 3 rounds =="
            for round in 1 2 3; do
              for id in 13770 419 1537 8050 204985; do
                curl -s -o /dev/null -m 30 -w "round$round /product/$id http=%{http_code} t=%{time_total}s\n" "https://savy.co.il/product/$id" || echo "round$round /product/$id FAILED"
              done
            done
            echo "== API endpoints (status + time) =="
            for u in "https://supermarket-compare-production.up.railway.app/api/product/13770" \
                     "https://supermarket-compare-production.up.railway.app/api/product/13770/prices" \
                     "https://supermarket-compare-production.up.railway.app/api/product/204985/prices" \
                     "https://supermarket-compare-production.up.railway.app/api/search?q=%D7%97%D7%9C%D7%91&limit=5"; do
              curl -s -o /tmp/resp -m 30 -w "$u http=%{http_code} t=%{time_total}s\n" "$u" || echo "$u FAILED"
              head -c 120 /tmp/resp; echo
            done
          } | tee bench-results/domain-probe.txt
      - name: Commit results
        run: |
          git config user.name "savy-bench"
          git config user.email "bench@savy.co.il"
          git checkout -B bench-data
          git add bench-results/domain-probe.txt
          git commit -m "chore(bench): domain redirect probe [skip ci]" || echo "no changes"
          git push -f origin bench-data
