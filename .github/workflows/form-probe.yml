name: Form Probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch form questions
        run: |
          set -o pipefail
          mkdir -p bench-results
          python3 - <<'EOF' 2>&1 | tee bench-results/form-probe.txt
          import json, re, urllib.request
          url = "https://docs.google.com/forms/d/e/1FAIpQLScFCb0tF31e85dotiyYQET8OGFUx2uWkXwtTcT2ty3SK8b3bg/viewform"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          html = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'ignore')
          m = re.search(r'FB_PUBLIC_LOAD_DATA_ = (.*?);</script>', html, re.S)
          data = json.loads(m.group(1))
          form = data[1]
          print("TITLE:", data[3] if len(data) > 3 else '')
          print("HEADER:", form[8] if len(form) > 8 else '')
          print("DESC:", form[0])
          TYPES = {0: 'short text', 1: 'paragraph', 2: 'multiple choice', 3: 'dropdown',
                   4: 'checkboxes', 5: 'linear scale', 7: 'grid', 9: 'date', 10: 'time'}
          for q in form[1] or []:
              title = q[1]
              qtype = TYPES.get(q[3], q[3])
              extra = ''
              if q[4] and q[4][0]:
                  required = bool(q[4][0][2])
                  opts = [o[0] for o in (q[4][0][1] or [])]
                  extra = f" required={required}" + (f" options={opts}" if opts else "")
              print(f"\nQ: {title} [{qtype}]{extra}")
              if q[2]: print(f"   help: {q[2]}")
          EOF
      - name: Commit results
        if: always()
        run: |
          git config user.name "savy-bench"
          git config user.email "bench@savy.co.il"
          git checkout -B bench-data
          git add bench-results/form-probe.txt
          git commit -m "chore(bench): form questions probe [skip ci]" || echo "no changes"
          git push -f origin bench-data
