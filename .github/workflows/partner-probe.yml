name: Partner Probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Submit test application
        run: |
          mkdir -p bench-results
          {
            echo "== POST /partners/apply (test) =="
            curl -sS -m 25 -w "\nhttp=%{http_code}\n" \
              -X POST https://supermarket-compare-production.up.railway.app/api/partners/apply \
              -H 'Content-Type: application/json' \
              -d '{"businessName":"בדיקת מערכת — סאבי","storeType":"אחר","city":"בדיקה","contactName":"מערכת","phone":"000","email":"","message":"פנייה לבדיקת צינור המייל — אפשר להתעלם"}'
          } | tee bench-results/partner-probe.txt
      - name: Commit results
        run: |
          git config user.name "savy-bench"
          git config user.email "bench@savy.co.il"
          git checkout -B bench-data
          git add bench-results/partner-probe.txt
          git commit -m "chore(bench): partner apply probe [skip ci]" || echo "no changes"
          git push -f origin bench-data
