name: Update Prices Daily

on:
  schedule:
    - cron: '0 1,9,15 * * *'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install "kaggle==1.6.17" psycopg2-binary

      - name: Verify script version
        run: head -3 scripts/update_prices.py

      - name: Download and update prices
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          python scripts/update_prices.py 2>&1 | tee /tmp/update.log || {
            echo "::error title=update_prices failed::$(tail -c 800 /tmp/update.log | tr '\n' ' ¦ ')"
            exit 1
          }

      - name: Run categories update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true
        run: python scripts/update_categories.py

      - name: Run images update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true
        run: python scripts/update_images.py

      - name: Run promotions update
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true
        run: python scripts/update_promos.py
